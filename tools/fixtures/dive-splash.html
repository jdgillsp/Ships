<!doctype html><html><head><link rel="icon" href="data:,"></head><body><script type="module">

const renderer = new THREE.WebGLRenderer(), scene = new THREE.Scene(), water = new THREE.Scene();
renderer.setSize(256, 256); document.body.append(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, 1, .1, 100); camera.position.set(0, 1, 5); camera.lookAt(0, 1, 0); camera.updateMatrixWorld();
