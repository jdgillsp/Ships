<!doctype html><html><head><link rel="icon" href="data:,"></head><body><script type="module">
import * as THREE from 'three';
import { DiverBubbles } from '../../src/game/DiverBubbles.js';
import { U, updateFrameUniforms } from '../../src/core/SharedUniforms.js';
const renderer = new THREE.WebGLRenderer(), scene = new THREE.Scene(), water = new THREE.Scene();
renderer.setSize(128, 128); document.body.append(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, 1, .1, 100); camera.position.set(0, -10, 5); camera.lookAt(0, -10, 0); camera.updateMatrixWorld();
const env = new THREE.DataTexture(new Uint8Array([180, 210, 240, 255]), 1, 1); env.needsUpdate = true;
U.uEnvMap.value = env; U.uEnvMaxLod.value = 0; U.uSunDir.value.set(.3, .7, .2).normalize(); U.uSunIntensity.value = 3; U.uResolution.value.set(128, 128);
const bubbles = new DiverBubbles({ renderer, camera, scene, underwater: { scene: water } });
const target = new THREE.WebGLRenderTarget(128, 128, { count: 2, type: THREE.FloatType });

attrs.position.setXYZ(0, 0, -10, 0); attrs.aPrevious.setXYZ(0, -.1, -10, 0); attrs.aRadius.setX(0, .5); attrs.aOpacity.setX(0, 1); bubbles.geometry.setDrawRange(0, 1);

  camera.position.y = -depth; camera.lookAt(0, -depth, 0); camera.updateMatrixWorld();
  U.uLamp.value = lamp; U.uDiveForward.value.set(0, 0, -1);
  const z = near ? 4.8 : 0; attrs.position.setXYZ(0, 0, -depth, z); attrs.aPrevious.setXYZ(0, -.1, -depth, z);
  for (const attr of Object.values(attrs)) attr.needsUpdate = true;
  updateFrameUniforms(camera, camera.projectionMatrix, 1 / 60, 1, 1);
  U.uPrevViewProjNJ.value.copy(U.uViewProjNJ.value);
  const expected = new THREE.Vector3(0, -depth, z).applyMatrix4(U.uViewProjNJ.value).sub(new THREE.Vector3(-.1, -depth, z).applyMatrix4(U.uPrevViewProjNJ.value)).multiplyScalar(.5);
  renderer.setRenderTarget(target); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(water, camera);
  const colors = new Float32Array(128 * 128 * 4), velocity = new Float32Array(colors.length);
  renderer.readRenderTargetPixels(target, 0, 0, 128, 128, colors);
  const gl = renderer.getContext(); gl.readBuffer(gl.COLOR_ATTACHMENT1); gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.FLOAT, velocity); gl.readBuffer(gl.COLOR_ATTACHMENT0);
  let pixels = 0, error = 0, maxAlpha = 0, maxColor = 0;
  for (let i = 0; i < colors.length; i += 4) if (colors[i + 3] > .01) {
    pixels++; maxAlpha = Math.max(maxAlpha, colors[i + 3]); maxColor = Math.max(maxColor, colors[i], colors[i + 1], colors[i + 2]);

  }
  return { pixels, error, maxAlpha, maxColor, expectedMotion: expected.x, calls: renderer.info.render.calls };
}; window.ready = true;
</script></body></html>
